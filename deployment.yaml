apiVersion: apps/v1
kind: Deployment

metadata:
  name: iris-api

spec:
  replicas: 1

  strategy:
      type: Recreate

  selector:
    matchLabels:
      app: iris-api

  template:
    metadata:
      labels:
        app: iris-api

    spec:
      containers:
      - name: iris-api
        image: us-central1-docker.pkg.dev/mlops-500009/iris-repo/iris-api:v1

        ports:
        - containerPort: 8000

        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"